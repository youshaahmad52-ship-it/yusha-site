projects:
  - title: "StockSync, a warehouse inventory program"
    summary: "A menu-driven inventory program in C for the CSE214 Algorithm Lab. Add, edit and remove products, record stock in and out, search and sort, and print low-stock, category-value and supplier reports. Saves to file, exports to CSV and keeps a backup."
    tech: ["C", "File storage", "CSV"]
    alt: "The StockSync main menu in a terminal, listing the dashboard, product, stock, search, report and backup options."
    live: ""
    code: "https://github.com/youshaahmad52-ship-it/WareHouse-Inventory"
    featured: true
  - title: "Digital ammeter"
    summary: "A small current meter built with friends. A sensor sits in series with the load, an Arduino reads its voltage and turns it into milliamps, and the reading is shown live. We checked it against a multimeter until the two agreed."
    tech: ["Arduino", "Current sensor", "Electronics"]
    alt: "Demo photo: a multimeter and test leads measuring the current drawn by a small circuit."
    live: ""
    code: ""
    featured: true
  - title: "Clap-controlled light"
    summary: "Clap once and the light turns on, clap again and it turns off. A microphone module feeds the Arduino, which looks for a sharp spike in sound and switches the light through a relay. Most of the work was tuning it so talking does not trigger it."
    tech: ["Arduino", "Sound sensor", "Relay"]
    alt: "Demo photo: an Arduino with a microphone module on a breadboard, lighting a grid of LEDs."
    live: ""
    code: ""
    featured: true
  - title: "Student result calculator"
    summary: "A C program that takes the marks for each subject and prints the grade, grade point, total and GPA, using the grading scale from school."
    tech: ["C"]
    alt: "The result calculator running in a terminal, printing marks, grades, points and a GPA of 3.85."
    live: ""
    code: ""
    featured: false
  - title: "Simple bank account"
    summary: "A console program in Java for a course. One account with deposit, withdraw and balance check, and a refusal when a withdrawal is larger than the balance."
    tech: ["Java"]
    alt: "The bank account program running in a terminal, showing deposits, withdrawals and a refused withdrawal."
    live: ""
    code: ""
    featured: false
  - title: "My first web page"
    summary: "A one-page introduction to myself in plain HTML: headings, a list of hobbies, a table of the classes I teach and an email link."
    tech: ["HTML"]
    alt: "A plain HTML page titled Hello, I am Yousha Ahmad, with a hobby list and a table of subjects taught."
    live: ""
    code: ""
    featured: false

