brief: "I'm a CSE student at Daffodil International University. I write C and Java for my courses, teach school students on the side, and play goalkeeper for fun and for my team."

bio: |
  I'm Yousha, a Computer Science and Engineering student at Daffodil International University in my first year, with a CGPA of 3.50. I write C and Java for my courses and I'm getting comfortable with HTML.

  The project I'm proudest of is StockSync, a warehouse inventory program in C for the CSE214 Algorithm Lab. Away from the keyboard I like building small electronics with friends: a digital ammeter, and a light that switches on when you clap.

  For about a year I've tutored school students from Play to Class 10 in maths, science, English and ICT, online and at their homes. Teaching is how I find out whether I really understand something.

  At school I was games prefect. I organised inter-house games and led the football team, and I play in goal. I ran my first marathon with Navana Runners in 2025, and I have supported Spain for as long as I have watched football.

